<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Agenda Santé – démo</title>
<style>
:root{--fond:#f2f5f7;--carte:#fff;--encre:#15232e;--doux:#5d6b76;--trait:#e1e7ec;--accent:#1d5f7a;--accent-f:#e3eff5;--rouge:#c2412d;--rouge-f:#fbe7e3;--vert:#1f8255;--vert-f:#e2f1e9;--orange:#c46a12;--orange-f:#fbeedd;--ombre:0 1px 2px rgba(21,35,46,.05),0 8px 24px rgba(21,35,46,.06)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--fond);color:var(--encre);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:10px;padding:8px 15px;font-weight:600;font-size:14px;min-height:40px;white-space:nowrap}
.btn:hover{filter:brightness(.94)}
.btn.clair{background:var(--carte);color:var(--encre);border-color:var(--trait)}
.btn.petit{padding:5px 11px;min-height:32px;font-size:13px;font-weight:500}
.btn.danger{color:var(--rouge)}
.btn.on{background:var(--accent-f);border-color:var(--accent);color:var(--accent)}
label{display:grid;gap:5px;font-size:12.5px;font-weight:600;color:var(--doux);min-width:0}
input,select,textarea{font-size:15px;font-weight:400;color:var(--encre);background:#fff;border:1px solid var(--trait);border-radius:10px;padding:9px 11px;width:100%;min-height:42px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-f)}
textarea{resize:vertical;min-height:90px}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;color:var(--encre)}
.chk input{width:18px;height:18px;min-height:0;accent-color:var(--accent)}

/* Structure */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.cote{background:var(--carte);border-right:1px solid var(--trait);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow:auto}
.marque{padding:0 10px}
.marque b{display:block;font-size:17px;letter-spacing:-.01em}
.marque span{font-size:12.5px;color:var(--doux)}
.menu{display:grid;gap:2px}
.menu button{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;font-weight:500;color:var(--doux);width:100%;text-align:left}
.menu button:hover{background:var(--fond);color:var(--encre)}
.menu button[aria-current=page]{background:var(--accent-f);color:var(--accent);font-weight:600}
.menu .nb{margin-left:auto;background:var(--accent);color:#fff;border-radius:20px;font-size:11.5px;font-weight:700;padding:0 7px;line-height:19px}
.qui{margin-top:auto;padding:0 6px;display:grid;gap:8px}
.qui small{color:var(--doux);font-size:12px}
.main{padding:26px clamp(16px,3vw,36px) 60px;min-width:0}
.tete{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.tete h1{font-size:25px;letter-spacing:-.02em;font-weight:650}
.tete p{color:var(--doux)}
.outils{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.carte{background:var(--carte);border-radius:16px;box-shadow:var(--ombre);padding:18px 20px}
.carte h2{font-size:15.5px;font-weight:650;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.carte h2 small{font-weight:500;color:var(--doux);font-size:12.5px}
.grille{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.ligne.clic{cursor:pointer;border-radius:8px}
.ligne.clic:hover{background:#f7fafb}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--carte);border-radius:16px;box-shadow:var(--ombre);padding:16px 18px}
.kpi span{display:block;font-size:12.5px;color:var(--doux);font-weight:500}
.kpi b{display:block;font-size:28px;font-weight:650;letter-spacing:-.02em;margin-top:4px}
.kpi small{color:var(--doux);font-size:12px}
.ligne{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--trait)}
.ligne:first-of-type{border-top:0}
.ligne .h{font-weight:650;min-width:48px;font-variant-numeric:tabular-nums}
.ligne .q{flex:1;min-width:0}
.ligne .q b{display:block;font-weight:600}
.ligne .q small{color:var(--doux);font-size:12.5px}
.vide{color:var(--doux);padding:12px 0}
.puce{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--fond);color:var(--doux)}
.p-arrive{background:var(--orange-f);color:var(--orange)}
.p-consult{background:var(--accent-f);color:var(--accent)}
.p-termine{background:var(--vert-f);color:var(--vert)}
.p-absent,.p-annule{background:var(--rouge-f);color:var(--rouge)}
.p-ligne{background:#eef0fb;color:#3d4a9c}
.pastille{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--doux);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--trait);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--trait);vertical-align:top}
tr.clic{cursor:pointer}
tr.clic:hover td{background:#f7fafb}
.tablewrap{overflow-x:auto}
.form{display:grid;gap:12px}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.note{color:var(--doux);font-size:13px}

/* Agenda */
.cal{background:var(--carte);border-radius:16px;box-shadow:var(--ombre);overflow:auto;max-height:calc(100vh - 170px)}
.calg{display:grid;min-width:640px;position:relative}
.colh{position:sticky;top:0;z-index:3;background:var(--carte);border-bottom:1px solid var(--trait);padding:10px 8px;font-weight:600;font-size:13px;text-align:center}
.colh small{display:block;font-weight:500;color:var(--doux);font-size:11.5px}
.colh.auj{color:var(--accent)}
.heures{position:relative;border-right:1px solid var(--trait)}
.heures span{position:absolute;right:6px;font-size:11px;color:var(--doux);transform:translateY(-50%)}
.col{position:relative;border-right:1px solid var(--trait);cursor:copy}
.col .ferme{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,#f3f5f7 0 6px,#eaeef1 6px 12px)}
.col .abs{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,#fbe7e3 0 6px,#f6d6cf 6px 12px);display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font-size:12px;font-weight:600;color:var(--rouge);text-align:center}
.col .trait{position:absolute;left:0;right:0;border-top:1px solid #eef2f5}
.maint{position:absolute;left:0;right:0;border-top:2px solid var(--rouge);pointer-events:none}
.maint:before{content:"";position:absolute;left:-4px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--rouge);z-index:3}
.rdv{position:absolute;left:3px;right:3px;border-radius:7px;background:var(--f);border-left:3px solid var(--c);color:var(--x);padding:3px 7px;font-size:12px;line-height:1.25;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;text-align:left;z-index:1}
.rdv b{font-weight:650}
.rdv.annule{opacity:.45;text-decoration:line-through}
.rdv.absent{background:var(--rouge-f);border-left-color:var(--rouge);color:var(--rouge)}
.rdv.arrive{box-shadow:inset 0 0 0 2px var(--orange)}
.rdv.consult{box-shadow:inset 0 0 0 2px var(--accent)}
.rdv.termine{opacity:.7}
.rdv.urg{left:46%;border-left-color:var(--rouge);z-index:2;box-shadow:0 2px 8px rgba(21,35,46,.18)}
.sur{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--doux);font-weight:600;margin-bottom:4px}
.choix{justify-content:flex-start;white-space:normal;text-align:left;font-weight:500}
.rdv .ic-s{float:right;font-size:11px;font-weight:700}
.legende{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--doux)}
.legende span{display:inline-flex;align-items:center;gap:6px}

/* Motifs : couleurs */
.m0{--c:#1d5f7a;--f:#e3eff5;--x:#123f52}
.m1{--c:#6a4fb3;--f:#ece7f7;--x:#3f2b78}
.m2{--c:#1f8255;--f:#e2f1e9;--x:#14523a}
.m3{--c:#8a6d12;--f:#f6efd8;--x:#5a470a}
.m4{--c:#c0577f;--f:#f9e4ec;--x:#7a2848}
.m5{--c:#c46a12;--f:#fbeedd;--x:#7a430f}
.m6{--c:#2b7a8a;--f:#dff1f3;--x:#15505b}
.m7{--c:#4f6b2a;--f:#edf0dc;--x:#3f4916}

/* Barres (stats) */
.barres{display:grid;gap:9px}
.barre{display:grid;grid-template-columns:150px minmax(0,1fr) 48px;align-items:center;gap:10px;font-size:13px}
.barre i{display:block;height:12px;border-radius:6px;background:var(--accent)}
.barre em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--doux)}
.cols{display:flex;align-items:flex-end;gap:10px;height:160px;padding-top:10px}
.cols div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--doux);height:100%;justify-content:flex-end}
.cols i{display:block;width:100%;max-width:46px;border-radius:6px 6px 0 0;background:var(--accent)}

/* Fenêtres */
.voile{position:fixed;inset:0;background:rgba(21,35,46,.38);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto}
.fen{background:var(--carte);border-radius:18px;width:min(560px,100%);padding:22px;box-shadow:0 30px 70px rgba(21,35,46,.3)}
.fen h3{font-size:18px;font-weight:650;margin-bottom:4px}
.fen .sous{color:var(--doux);margin-bottom:14px}
.fen .pied{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.statuts{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--encre);color:#fff;padding:11px 18px;border-radius:12px;font-weight:500;z-index:40;max-width:calc(100vw - 32px);box-shadow:0 10px 30px rgba(0,0,0,.2)}
.demo{background:#fff8e6;color:#6d5410;border:1px solid #f0dfaa;border-radius:12px;padding:9px 14px;font-size:13px;margin-bottom:16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* Écran salle d'attente */
#ecran{position:fixed;inset:0;background:#0f2a37;color:#fff;z-index:30;padding:5vh 6vw;display:flex;flex-direction:column;gap:3vh}
#ecran h2{font-size:clamp(22px,3vw,40px);font-weight:600}
#ecran .appel{font-size:clamp(28px,5vw,70px);font-weight:700;letter-spacing:-.02em}
#ecran .appel small{display:block;font-size:.4em;font-weight:500;opacity:.75}
#ecran ul{list-style:none;display:grid;gap:1.4vh;font-size:clamp(18px,2.2vw,30px)}

@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .cote{position:sticky;top:0;z-index:10;height:auto;flex-direction:row;align-items:center;padding:10px 12px;overflow-x:auto;gap:10px;border-right:0;border-bottom:1px solid var(--trait)}
  .marque,.qui{display:none}
  .menu{display:flex;gap:4px}
  .menu button{white-space:nowrap;padding:8px 10px}
  .g2,.g3{grid-template-columns:1fr}
  .f2{grid-template-columns:1fr}
  .barre{grid-template-columns:110px minmax(0,1fr) 40px}
  .cal{max-height:none}
}

/* Style verre dépoli */
:root{--fond:rgba(255,255,255,.55);--carte:rgba(255,255,255,.42);--encre:#13303a;--doux:#45666e;--trait:rgba(255,255,255,.75);--accent:#0f7c80;--accent-f:rgba(15,124,128,.13);--ombre:0 10px 30px rgba(20,60,70,.10),inset 0 1px 0 rgba(255,255,255,.8);--verre:blur(22px) saturate(160%)}
body{background:#dfeef0 fixed;background-image:radial-gradient(620px 620px at 8% 0%,rgba(124,198,201,.85),transparent 70%),radial-gradient(520px 520px at 100% 25%,rgba(159,201,239,.8),transparent 70%),radial-gradient(480px 480px at 55% 105%,rgba(244,185,138,.7),transparent 70%),radial-gradient(320px 320px at 30% 55%,rgba(207,231,216,.8),transparent 70%);background-attachment:fixed}
.cote,.carte,.kpi,.cal,.fen{background:var(--carte);border:1px solid rgba(255,255,255,.7);-webkit-backdrop-filter:var(--verre);backdrop-filter:var(--verre);box-shadow:var(--ombre)}
.app{gap:20px;padding:20px}
.cote{border-radius:20px;height:calc(100vh - 40px);top:20px}
.carte,.kpi,.cal{border-radius:20px}
.main{padding:6px 16px 60px 0}
.colh{background:rgba(240,248,249,.96);-webkit-backdrop-filter:var(--verre);backdrop-filter:var(--verre)}
.menu button[aria-current=page]{background:rgba(255,255,255,.75);color:#0b5f63;box-shadow:0 2px 8px rgba(20,60,70,.08)}
.menu button:hover{background:rgba(255,255,255,.5)}
.menu .nb{background:#e8590c}
.btn{border-radius:12px}
.btn:not(.clair):not(.on):not(.danger){box-shadow:0 6px 16px rgba(15,124,128,.28)}
.btn.clair{background:rgba(255,255,255,.6);border-color:rgba(255,255,255,.85)}
input,select,textarea{background:rgba(255,255,255,.75);border-color:rgba(255,255,255,.9)}
.puce{border-radius:99px;padding:2px 10px}
.fen{background:rgba(255,255,255,.78)}
.voile{background:rgba(19,48,58,.25);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.demo{background:rgba(255,248,230,.6);border-color:rgba(240,223,170,.8);-webkit-backdrop-filter:var(--verre);backdrop-filter:var(--verre)}
@media(max-width:900px){
  .app{padding:10px;gap:12px}
  .cote{height:auto;top:10px;border-radius:16px}
  .main{padding:0 0 60px}
  .carte{overflow-x:auto;min-width:0}
}
</style>
</head>
<body>
<div class="app">
  <aside class="cote">
    <div class="marque"><b>Agenda Santé</b><span id="nomCentre"></span></div>
    <nav class="menu" id="menu"></nav>
    <div class="qui">
      <label>Connecté en tant que<select id="role"></select></label>
      <small>Démo : données fictives, rien n'est envoyé.</small>
      <button class="btn clair petit" type="button" id="reset">Remettre la démo à zéro</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="voile" id="voile" hidden><div class="fen" id="fen" role="dialog" aria-modal="true"></div></div>
<div id="ecran" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
var MODE='centre';try{MODE=localStorage.getItem('agenda-sante-mode')==='solo'?'solo':'centre'}catch(e){}
var SOLO=MODE==='solo',LIEU=SOLO?'cabinet':'centre';
var CLE='agenda-sante-demo-v5-'+MODE;
var $=function(id){return document.getElementById(id)};

function pad(n){return String(n).padStart(2,'0')}
function cle(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function jour(k){var p=k.split('-');return new Date(+p[0],p[1]-1,+p[2])}
function plus(k,n){var d=jour(k);d.setDate(d.getDate()+n);return cle(d)}
function hm(m){return Math.floor(m/60)+':'+pad(m%60)}
var SIMU=null;
function nowMin(){if(SIMU!=null)return SIMU;var d=new Date();return d.getHours()*60+d.getMinutes()}
var AUJ=(function(){var d=new Date();if(d.getDay()===0)d.setDate(d.getDate()+1);return cle(d)})();
var JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];

function dLong(k){var d=jour(k);return JOURS[d.getDay()]+' '+d.getDate()+' '+MOIS[d.getMonth()]}
function dCourt(k){var d=jour(k);return pad(d.getDate())+'/'+pad(d.getMonth()+1)}
function ic(p){return'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>'}
var ICO={
  bord:'<path d="M4 13h6V4H4zM14 20h6v-9h-6zM14 4v4h6V4zM4 20h6v-4H4z"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  salle:'<path d="M5 20v-6a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v6M3 20h18M9 7a3 3 0 1 0 6 0a3 3 0 0 0-6 0"/>',
  patients:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2 .6 3.5 2.6 3.5 6"/>',
  attente:'<path d="M5 6h14M5 12h14M5 18h9"/>',
  abs:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
  ligne:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/>',
  msg:'<path d="M4 5h16v11H9l-5 4z"/>',
  stats:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  regl:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'
};

/* ---------- données fictives ---------- */
var CENTRE=SOLO?{nom:'Cabinet du Dr Laura Dubois',adresse:'Rue de la Station 12, 7100 La Louvière',tel:'064 22 33 44'}:{nom:'Centre médical des Tilleuls',adresse:'Rue de la Station 12, 7100 La Louvière',tel:'064 22 33 44'};
var PROS=[
  {id:'dubois',nom:'Dr Laura Dubois',court:'Dr Dubois',spec:'Médecin généraliste',h:{1:[[480,720],[840,1080]],2:[[480,720],[840,1080]],3:[[480,720]],4:[[480,720],[840,1080]],5:[[480,720],[840,1020]],6:[[540,720]]}},
  {id:'lambert',nom:'Dr Marc Lambert',court:'Dr Lambert',spec:'Médecin généraliste',h:{1:[[540,720],[900,1140]],2:[[540,720],[900,1140]],3:[[540,720],[840,1080]],4:[[900,1140]],5:[[540,720],[840,1020]]}},
  {id:'martin',nom:'Sophie Martin',court:'S. Martin',spec:'Kinésithérapeute',h:{1:[[480,750],[810,1080]],2:[[480,750]],3:[[480,750],[810,1080]],4:[[480,750],[810,1080]],5:[[480,750]]}}
];
var MOTIFS=[
  {id:'consult',nom:'Consultation',duree:15,pros:['dubois','lambert'],ligne:true,nouveaux:true,poids:10},

function libre(p,k,t,d,sauf){
  var dw=jour(k).getDay(),ok=(pro(p).h[dw]||[]).some(function(iv){return t>=iv[0]&&t+d<=iv[1]});
  if(!ok||absent(p,k))return false;

}
function premiere(m,p){
  var mo=motif(m),ps=p?[p]:mo.pros,best=null;
  for(var off=0;off<60&&!best;off++){
    var k=plus(AUJ,off);
    ps.forEach(function(pp){
      if(best&&best.date===k&&best.debut<=600)return;
      for(var t=480;t<=1140-mo.duree;t+=5){
        if(off===0&&t<nowMin()+30)continue;

      }
    });
  }
  return best;
}

    for(var t=H0+30;t<H1;t+=30)z+='<div class="trait" style="top:'+((t-H0)*PX)+'px"></div>';

/* ---------- ce que voit le patient : réservation en ligne, avec les règles enregistrées ---------- */
function apercu(){
  var E={etape:0,connu:null,motif:null,pro:'',date:null,t:null,p:null},L=S.ligne;
  function cadre(h,retour){
    ouvrir('<p class="sur">Ce que voit le patient</p><h3>Prendre rendez-vous</h3><p class="sous">'+esc(CENTRE.nom)+'</p>'+(L.message?'<p class="note" style="margin-bottom:14px">'+esc(L.message)+'</p>':'')+h+'<div class="pied">'+(retour?'<button class="btn clair" type="button" id="apR">Retour</button>':'')+'<button class="btn clair" type="button" data-fermer>Fermer</button></div>');
    if(retour)$('apR').onclick=function(){E.etape--;if(E.etape===2&&unSeul())E.etape=1;go()};
  }
  function choix(items){return'<div class="form">'+items.map(function(i){return'<button type="button" class="btn clair choix" data-c="'+esc(i[0])+'">'+i[1]+'</button>'}).join('')+'</div>'}
  function clic(f){$('fen').querySelectorAll('[data-c]').forEach(function(b){b.onclick=function(){f(b.dataset.c)}})}
  function unSeul(){return motif(E.motif).pros.length<2}
  function titre(t){return'<p style="margin-bottom:10px"><b>'+t+'</b></p>'}
  function slots(k){
    var mo=motif(E.motif),ps=E.pro?[E.pro]:mo.pros,o={},d=Math.round((jour(k)-jour(AUJ))/864e5);
    ps.forEach(function(pp){(pro(pp).h[jour(k).getDay()]||[]).forEach(function(iv){
      for(var t=iv[0];t+mo.duree<=iv[1];t+=mo.duree){if(d*1440+t-nowMin()<L.delai*60)continue;if(o[t]==null&&libre(pp,k,t,mo.duree))o[t]=pp}
    })});
    return o;
  }
  function go(){
    if(!L.actif)return cadre('<p>La réservation en ligne est fermée pour le moment. Appelez le '+esc(CENTRE.tel)+'.</p>');
    if(E.etape===0){cadre(titre('Êtes-vous déjà venu au '+LIEU+' ?')+choix([['1','Oui, je suis déjà patient'],['0','Non, c\'est la première fois']]));clic(function(v){E.connu=v==='1';E.etape=1;go()});return}
    if(E.etape===1){
      if(!E.connu&&L.connus)return cadre('<p>La réservation en ligne est réservée aux patients déjà connus. Pour un premier rendez-vous, appelez le '+esc(CENTRE.tel)+'.</p>',true);
      var ms=MOTIFS.filter(function(m){var c=motif(m.id);return c.ligne&&(E.connu||c.nouveaux)});
      cadre(ms.length?titre('Quel est le motif de votre visite ?')+choix(ms.map(function(m){return[m.id,esc(m.nom)+' <small class="note">· '+motif(m.id).duree+' min</small>']})):'<p>Aucun motif n\'est réservable en ligne. Appelez le '+esc(CENTRE.tel)+'.</p>',true);
      clic(function(v){E.motif=v;E.pro=unSeul()?motif(v).pros[0]:'';E.etape=unSeul()?3:2;go()});return;
    }
    if(E.etape===2){
      cadre(titre('Avec qui ?')+choix([['','Le premier disponible']].concat(motif(E.motif).pros.map(function(q){return[q,esc(pro(q).nom)+' <small class="note">· '+esc(pro(q).spec)+'</small>']}))),true);
      clic(function(v){E.pro=v;E.etape=3;go()});return;
    }
    if(E.etape===3){
      var h='',n=0,abs=null;
      for(var i=0;i<=L.horizon&&n<4;i++){
        var k=plus(AUJ,i);
        if(E.pro){var a=absent(E.pro,k);if(a){abs=abs||a;continue}}
        var o=slots(k),ts=Object.keys(o).map(Number).sort(function(a,b){return a-b});
        if(!ts.length)continue;n++;
        h+='<p style="margin:12px 0 6px"><b>'+dLong(k)+'</b></p><div class="statuts">'+ts.slice(0,10).map(function(t){return'<button type="button" class="btn clair petit" data-c="'+k+'|'+t+'|'+o[t]+'">'+hm(t)+'</button>'}).join('')+(ts.length>10?'<span class="note" style="align-self:center">+ '+(ts.length-10)+' autres</span>':'')+'</div>';
      }
      cadre((abs?'<p class="note" style="color:var(--rouge)">'+esc(abs.message)+(abs.remplacant?' Remplaçant : '+esc(remp(abs))+'.':'')+'</p>':'')+(h?titre('Choisissez un créneau')+h:'<p>Aucun créneau libre dans les '+L.horizon+' prochains jours. Appelez le '+esc(CENTRE.tel)+'.</p>'),true);
      clic(function(v){v=v.split('|');E.date=v[0];E.t=+v[1];E.p=v[2];E.etape=4;go()});return;
    }
    cadre(titre(dLong(E.date)+' à '+hm(E.t))+'<p style="margin:-6px 0 12px">'+esc(pro(E.p).nom)+' · '+esc(motif(E.motif).nom)+'</p><div class="form"><div class="f2"><label>Prénom<input id="apP" value="Camille"></label><label>Nom<input id="apN" value="Démo"></label></div><label>GSM<input id="apG" value="0470 12 34 56"></label><label class="chk"><input type="checkbox" id="apC" checked> J\'accepte de recevoir la confirmation et le rappel par SMS</label><p class="err" id="apE" hidden></p><button class="btn" type="button" id="apOk">Confirmer le rendez-vous</button></div>',true);
    $('apOk').onclick=function(){
      var pr=$('apP').value.trim()||'Patient',no=$('apN').value.trim()||'Démo';
      var pt=S.pats.find(function(x){return x.prenom.toLowerCase()===pr.toLowerCase()&&x.nom.toLowerCase()===no.toLowerCase()});
      if(pt&&pt.bloque){$('apE').textContent='La réservation en ligne n\'est pas possible pour ce dossier. Merci d\'appeler le '+CENTRE.tel+'.';$('apE').hidden=false;return}
      if(!pt){pt={id:'p'+Date.now(),prenom:pr,nom:no,naissance:'1990-01-01',niss:'à compléter',mutuelle:'à compléter',tel:$('apG').value,email:'',traitant:PROS[0].id,sms:$('apC').checked,bloque:false,nouveau:true,cree:AUJ};S.pats.push(pt)}

  function maj(){document.querySelectorAll('[data-txt]').forEach(function(t){var k=t.dataset.txt,v=remplir(t.value,U.ex),n=v.length,u=Math.ceil(n/153)||1;document.querySelector('[data-ap="'+k+'"]').textContent=v;document.querySelector('[data-cpt="'+k+'"]').textContent=n+' caractères · '+(n<=160?'1 SMS':u+' SMS');})}
  document.querySelectorAll('[data-txt]').forEach(function(t){t.oninput=maj});maj();
  $('mOk').onclick=function(){document.querySelectorAll('[data-txt]').forEach(function(t){S.textes[t.dataset.txt]=t.value});S.rappelH=+$('mH').value;save();toast('Textes enregistrés.')};
};

/* ---------- Statistiques ---------- */
VUES_R.stats=function(){
  var d0=plus(AUJ,-28),l=S.rdvs.filter(function(r){return r.date>=d0&&r.date<AUJ}),a=actifs(l),abs=l.filter(function(r){return r.statut==='absent'}).length,ann=l.filter(function(r){return r.statut==='annule'}).length,lig=a.filter(function(r){return r.source==='en ligne'}).length;
  var nouv=a.filter(function(r){return r.motif==='premiere'||r.motif==='bilan'}).length;
  function barres(items){var mx=Math.max.apply(null,items.map(function(i){return i[1]}))||1;return'<div class="barres">'+items.map(function(i){return'<div class="barre"><span>'+esc(i[0])+'</span><i style="width:'+(i[1]/mx*100)+'%;'+(i[2]?'background:'+i[2]:'')+'"></i><em>'+i[1]+'</em></div>'}).join('')+'</div>'}
  var html=tete('Statistiques','Les 4 dernières semaines (du '+dCourt(d0)+' à hier).');
  html+='<div class="kpis"><div class="kpi"><span>Rendez-vous honorés ou manqués</span><b>'+a.length+'</b></div><div class="kpi"><span>Réservés en ligne</span><b>'+Math.round(lig/(a.length||1)*100)+' %</b><small>'+lig+' rendez-vous</small></div><div class="kpi"><span>Absences non excusées</span><b>'+String(Math.round(abs/(a.length||1)*1000)/10).replace('.',',')+' %</b><small>'+abs+' rendez-vous</small></div><div class="kpi"><span>Annulations</span><b>'+ann+'</b></div><div class="kpi"><span>Nouveaux patients</span><b>'+nouv+'</b></div></div>';
  var occ=PROS.map(function(p){var dispo=0,pris=0;for(var k=d0;k<AUJ;k=plus(k,1)){if(absent(p.id,k))continue;(p.h[jour(k).getDay()]||[]).forEach(function(iv){dispo+=iv[1]-iv[0]})}actifs(l.filter(function(r){return r.pro===p.id})).forEach(function(r){pris+=r.duree});return[p.nom,Math.round(pris/(dispo||1)*100)]});
  html+='<div class="grille g2">'+(SOLO?'':'<div class="carte"><h2>Rendez-vous par praticien</h2>'+barres(PROS.map(function(p){return[p.nom,a.filter(function(r){return r.pro===p.id}).length]}))+'</div>')+
    '<div class="carte"><h2>Taux de remplissage<small>temps réservé / temps ouvert, en %</small></h2>'+barres(occ)+'</div>'+
    '<div class="carte"><h2>Par motif</h2>'+barres(MOTIFS.map(function(m){return[m.nom,a.filter(function(r){return r.motif===m.id}).length]}).filter(function(i){return i[1]}))+'</div>';
  var js=[1,2,3,4,5,6].map(function(w){return[JOURS[w].slice(0,3),a.filter(function(r){return jour(r.date).getDay()===w}).length]}),mx=Math.max.apply(null,js.map(function(x){return x[1]}))||1;
  html+='<div class="carte"><h2>Par jour de la semaine</h2><div class="cols">'+js.map(function(x){return'<div><b style="color:var(--encre)">'+x[1]+'</b><i style="height:'+(x[1]/mx*120)+'px"></i>'+x[0]+'</div>'}).join('')+'</div></div></div>';
  return html;
};

/* ---------- Centre et intégrations ---------- */
VUES_R.regl=function(){
  var I=S.integrations;
  var html=tete(SOLO?'Cabinet et intégrations':'Centre et intégrations','Horaires et liens avec vos logiciels.');
  html+='<div class="grille g2"><div class="carte"><h2>'+(SOLO?'Horaires de consultation':'Praticiens et horaires')+'</h2>'+PROS.map(function(p){return'<div class="ligne"><div class="q"><b>'+esc(p.nom)+'</b><small>'+esc(p.spec)+'<br>'+[1,2,3,4,5,6].filter(function(w){return p.h[w]}).map(function(w){return JOURS[w].slice(0,3)+'. '+p.h[w].map(function(iv){return hm(iv[0])+'–'+hm(iv[1])}).join(', ')}).join(' · ')+'</small></div></div>'}).join('')+'<p class="note" style="margin-top:8px">'+(SOLO?'Un télésecrétariat ou un remplaçant peut recevoir son propre accès.':'Chaque praticien a son compte et ne voit que son agenda. Le secrétariat voit tout le centre.')+'</p></div>'+
    '<div class="carte"><h2>Intégrations</h2><div class="form">'+
    '<label class="chk"><input type="checkbox" data-int="careconnect"'+(I.careconnect?' checked':'')+'> Logiciel médical CareConnect : patients et rendez-vous synchronisés, dossier ouvert depuis l\'agenda</label>'+
    '<label class="chk"><input type="checkbox" data-int="google"'+(I.google?' checked':'')+'> Google Agenda, Apple ou Outlook : les rendez-vous apparaissent dans l\'agenda personnel</label>'+
    '<label class="chk"><input type="checkbox" data-int="ehealth"'+(I.ehealth?' checked':'')+'> Lecture de la carte eID à l\'accueil pour créer la fiche patient</label>'+
    '<p class="note">eAttest, MyCareNet et le dossier médical restent dans le logiciel médical : l\'agenda ne remplace pas le DMI.</p></div></div>'+
    '<div class="carte"><h2>Sécurité et RGPD</h2><p class="note">Données hébergées dans l\'Union européenne, chiffrées, sauvegarde quotidienne. Connexion personnelle par praticien, double authentification. Journal des accès. Contrat de sous-traitance signé avec le '+LIEU+'. Aucune donnée médicale : seulement l\'administratif et le motif du rendez-vous.</p></div>'+
    '<div class="carte"><h2>'+esc(CENTRE.nom)+'</h2><p>'+esc(CENTRE.adresse)+'<br>'+esc(CENTRE.tel)+'</p><p style="margin-top:12px"><button class="btn clair petit" type="button" id="reset2">Remettre la démo à zéro</button></p></div></div>';
  return html;
};
AP.regl=function(){$('reset2').onclick=function(){$('reset').click()};document.querySelectorAll('[data-int]').forEach(function(c){c.onchange=function(){S.integrations[c.dataset.int]=c.checked;save();toast('Intégration '+(c.checked?'activée':'désactivée')+' (simulation).')}})};

$('reset').onclick=function(){if(!confirm('Remettre toutes les données de la démo à zéro ?'))return;S=generer();S.jour=AUJ;save();vue='bord';rendre();toast('Démo remise à zéro.')};
setInterval(function(){rattraper();save();if((vue==='bord'||vue==='salle')&&!document.querySelector('.voile:not([hidden])'))rendre()},60000);
rendre();
})();
</script>
