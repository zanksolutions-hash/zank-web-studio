<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Méga'Jump – Gestion des inscriptions</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kalam:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#141114;--card:#1e1a1e;--line:#2e282e;--txt:#f4eef2;--mut:#a3979f;--rose:#ff2d8a;--rose2:#ff6fb0;--ok:#3ecf8e;--warn:#f5b041;--ko:#ff5a5a;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 Inter,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.logo{font-family:Kalam,cursive;font-size:26px;color:#fff;letter-spacing:.5px}
.logo span{color:var(--rose)}
.wrap{max-width:1180px;margin:0 auto;padding:20px;display:grid;grid-template-columns:320px 1fr;gap:20px}
@media(max-width:860px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:0 0 12px;font-weight:600}
.btn{border:1px solid var(--line);background:#262026;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--rose)}
.btn.p{background:var(--rose);border-color:var(--rose);color:#fff}
.btn.p:hover{background:var(--rose2)}
.btn.s{padding:5px 10px;font-size:13px}
.seances{display:flex;flex-direction:column;gap:8px}
.se{padding:12px;border-radius:12px;border:1px solid var(--line);cursor:pointer;background:#1a161a}
.se.on{border-color:var(--rose);background:#2a1622}
.se b{display:block}
.se small{color:var(--mut)}
.bar{height:6px;background:#2e282e;border-radius:6px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--rose)}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.top h1{margin:0;font-size:24px}
.top p{margin:4px 0 0;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:#1a161a;border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{font-size:26px;display:block}
.stat small{color:var(--mut)}
.stat.hl b{color:var(--rose)}
form.add{display:grid;grid-template-columns:1.3fr 1fr auto;gap:8px;margin-bottom:14px}
@media(max-width:600px){form.add{grid-template-columns:1fr}}
input,select{background:#141114;border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--rose)}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{padding:6px 12px;border-radius:20px;border:1px solid var(--line);cursor:pointer;font-size:13px;background:none}
.tab.on{background:var(--rose);border-color:var(--rose);color:#fff}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.act{text-align:right;white-space:nowrap}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:20px;font-weight:600}
.t-ins{background:#3a1430;color:var(--rose2)}
.t-att{background:#3a2e12;color:var(--warn)}
.t-ann{background:#2e2626;color:var(--mut);text-decoration:line-through}
.t-pre{background:#123a28;color:var(--ok)}
.t-abs{background:#3a1616;color:var(--ko)}
.pay{cursor:pointer;border:none;background:none;font-size:13px;color:var(--mut);padding:0}
.pay.ok{color:var(--ok);font-weight:600}
.mut{color:var(--mut)}
.empty{padding:24px;text-align:center;color:var(--mut)}
dialog{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:var(--r);padding:20px;width:min(420px,92vw)}
dialog::backdrop{background:#000a}
dialog label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
textarea{width:100%;min-height:150px;background:#141114;border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--txt);font:14px/1.5 Inter,sans-serif}
a.btn{color:inherit;text-decoration:none;display:inline-block}
.wrap>*{min-width:0}
@media(max-width:860px){
  .seances{flex-direction:row;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
  .se{flex:0 0 200px;scroll-snap-align:start}
}
@media(max-width:600px){
  header{padding:12px 14px;flex-wrap:wrap;position:static}
  header>div{flex-wrap:wrap}
  header .btn{padding:7px 10px;font-size:13px;white-space:nowrap}
  .wrap{padding:12px;gap:12px}
  .card{padding:14px}
  .top h1{font-size:20px}
  .top>div:last-child{display:grid;grid-template-columns:1fr 1fr;width:100%}
  thead{display:none}
  table,tbody{display:block}
  tr{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
  td{padding:0;border:none}
  td:first-child{display:none}
  td:nth-child(2){font-weight:600}
  td:nth-child(3){grid-row:2;font-size:13px}
  td:nth-child(4){grid-column:2;grid-row:1;text-align:right}
  td:nth-child(5){grid-row:3}
  td.act{grid-column:2;grid-row:2/4;align-self:end;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 18px;border-radius:10px;font-weight:600;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div class="logo">Méga'<span>Jump</span></div>
  <div style="display:flex;gap:8px">
    <a class="btn" href="./" target="_blank">Page d'inscription</a>
    <button class="btn" id="bReset" title="Remettre les données de démo">Réinitialiser</button>
    <button class="btn p" id="bNew">+ Nouvelle séance</button>
  </div>
</header>

<div class="wrap">
  <aside class="card">
    <h2>Séances</h2>
    <div class="seances" id="listeSeances"></div>
  </aside>

  <main class="card" id="detail"></main>
</div>

<dialog id="dlgSeance">
  <form method="dialog" id="fSeance">
    <h2 id="dlgTitre">Nouvelle séance</h2>
    <label>Cours</label>
    <select name="cours"><option>Aérostep</option><option>Jumping</option><option>Step &amp; Cardio</option><option>Renfo</option></select>
    <label>Date</label><input type="date" name="date" required>
    <label>Heure</label><input type="time" name="heure" value="18:00" required>
    <label>Lieu</label><input name="lieu" value="École Saint François, Fontaine-l'Évêque" required>
    <label>Nombre de places</label><input type="number" name="places" min="1" value="16" required>
    <label>Prix (€)</label><input type="number" name="prix" min="0" step="0.5" value="8">
    <div class="row"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn p" value="ok">Enregistrer</button></div>
  </form>
</dialog>

<dialog id="dlgPost">
  <h2>Texte pour Facebook</h2>
  <textarea id="txtPost"></textarea>
  <div class="row"><button class="btn" onclick="dlgPost.close()">Fermer</button><button class="btn p" id="bCopier">Copier</button></div>
</dialog>

<div class="toast" id="toast"></div>

<script src="commun.js"></script>
<script>
let D=charger();
let filtre='tous';
const save=()=>enregistrer(D);
const S=()=>D.seances.find(s=>s.id===D.sel)||D.seances[0];
// Rafraîchit quand une inscription arrive depuis la page publique (autre onglet)
addEventListener('storage',e=>{if(e.key===CLE){D=charger();rendre()}});
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}

function rendre(){
  const ls=[...D.seances].sort((a,b)=>(a.date+a.heure).localeCompare(b.date+b.heure));
  const auj=jour(0);
  listeSeances.innerHTML=ls.map(s=>{
    const n=actifs(s).length,pass=s.date<auj;
    return `<div class="se ${s.id===D.sel?'on':''}" data-id="${s.id}" style="${pass?'opacity:.55':''}">
      <b>${esc(s.cours)} · ${s.heure.replace(':','h')}</b>
      <small>${s.date===auj?'Ce soir':fmtDate(s.date)}${pass?' (passée)':''}</small>
      <div class="bar"><i style="width:${Math.min(100,n/s.places*100)}%"></i></div>
      <small>${n}/${s.places} inscrites${s.inscrits.some(i=>i.statut==='att')?' · '+s.inscrits.filter(i=>i.statut==='att').length+' en attente':''}</small>
    </div>`}).join('');
  listeSeances.querySelectorAll('.se').forEach(e=>e.onclick=()=>{D.sel=e.dataset.id;filtre='tous';save();rendre()});

  const s=S();if(!s){detail.innerHTML='<div class="empty">Aucune séance.</div>';return}
  const att=s.inscrits.filter(i=>i.statut==='att').length;
  const payes=s.inscrits.filter(i=>i.paye&&i.statut!=='ann').length;
  const pass=s.date<auj;
  const liste=s.inscrits.filter(i=>filtre==='tous'?i.statut!=='ann':i.statut===filtre)
    .sort((a,b)=>({att:1}[a.statut]||0)-({att:1}[b.statut]||0)||a.ts-b.ts);
  const actions=i=>{
    if(i.statut==='ann')return `<button class="btn s" data-a="reins" data-i="${i.id}">Réinscrire</button>`;
    if(pass)return `<button class="btn s" data-a="pre" data-i="${i.id}">Présente</button> <button class="btn s" data-a="abs" data-i="${i.id}">Absente</button>`;
    return `${i.statut==='att'&&restant(s)>0?`<button class="btn s" data-a="promo" data-i="${i.id}">Passer inscrite</button> `:''}<button class="btn s" data-a="ann" data-i="${i.id}">Annuler</button>`;
  };
  detail.innerHTML=`
  <div class="top">
    <div><h1>${esc(s.cours)} – ${s.date===auj?'ce soir':fmtDate(s.date)} à ${s.heure.replace(':','h')}</h1>
    <p>${esc(s.lieu)} · ${s.prix} € la séance</p></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn" id="bPost">Texte Facebook</button>
      <button class="btn" id="bCsv">Export CSV</button>
      <button class="btn" id="bEdit">Modifier</button>
      <button class="btn" id="bDel">Supprimer</button>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><b>${actifs(s).length}</b><small>inscrites / ${s.places}</small></div>
    <div class="stat hl"><b>${restant(s)}</b><small>places restantes</small></div>
    <div class="stat"><b>${att}</b><small>en liste d'attente</small></div>
    <div class="stat"><b>${payes*s.prix} €</b><small>${payes} payé${payes>1?'s':''} sur ${actifs(s).length}</small></div>
  </div>
  ${pass?'':`<form class="add" id="fAdd">
    <input name="nom" placeholder="Nom et prénom" required>
    <input name="tel" placeholder="GSM (ex. 0470 12 34 56)">
    <button class="btn p">${restant(s)>0?'Inscrire':'Ajouter en attente'}</button>
  </form>`}
  <div class="tabs">${[['tous','Toutes'],['ins','Inscrites'],['att','Attente'],['pre','Présentes'],['abs','Absentes'],['ann','Annulées']]
    .map(([k,l])=>`<button class="tab ${filtre===k?'on':''}" data-f="${k}">${l}</button>`).join('')}</div>
  ${liste.length?`<table><thead><tr><th>#</th><th>Nom</th><th>GSM</th><th>Statut</th><th>Paiement</th><th></th></tr></thead><tbody>
  ${liste.map((i,n)=>`<tr><td class="mut">${n+1}</td><td>${esc(i.nom)}</td><td class="mut">${esc(i.tel||'–')}</td>
    <td><span class="tag t-${i.statut}">${STATUTS[i.statut]}</span></td>
    <td><button class="pay ${i.paye?'ok':''}" data-a="pay" data-i="${i.id}">${i.paye?'Payé':'À payer'}</button></td>
    <td class="act">${actions(i)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Personne ici.</div>'}`;

  detail.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{filtre=b.dataset.f;rendre()});
  detail.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>action(b.dataset.a,b.dataset.i));
  const f=document.getElementById('fAdd');
  if(f)f.onsubmit=e=>{e.preventDefault();const nom=f.nom.value.trim();if(!nom)return;
    if(s.inscrits.some(i=>i.nom.toLowerCase()===nom.toLowerCase()&&i.statut!=='ann'))return toast('Déjà inscrite');
    const st=restant(s)>0?'ins':'att';
    s.inscrits.push({id:uid(),nom,tel:f.tel.value.trim(),statut:st,paye:false,ts:Date.now()});
    save();rendre();toast(st==='ins'?nom+' inscrite':nom+' en liste d\'attente')};
  bPost.onclick=post;bCsv.onclick=csv;
  bEdit.onclick=()=>ouvrir(s);
  bDel.onclick=()=>{if(confirm('Supprimer cette séance et ses inscriptions ?')){D.seances=D.seances.filter(x=>x!==s);D.sel=D.seances[0]?.id;save();rendre()}};
}

function action(a,id){
  const s=S(),i=s.inscrits.find(x=>x.id===id);
  if(a==='pay')i.paye=!i.paye;
  else if(a==='ann'){const etait=i.statut,suiv=annuler(s,i);
    if(suiv)toast(suiv.nom+' passe de l\'attente à inscrite');else if(etait==='ins')toast('Une place se libère')}
  else if(a==='reins')i.statut=restant(s)>0?'ins':'att';
  else if(a==='promo')i.statut='ins';
  else if(a==='pre'||a==='abs')i.statut=a;
  save();rendre();
}

function post(){
  const s=S(),r=restant(s);
  txtPost.value=`${s.date===jour(0)?'CE SOIR':fmtDate(s.date).toUpperCase()}, ON PASSE EN MODE ${s.cours.toUpperCase()} !

${s.heure.replace(':','h')} – ${s.lieu}
Déjà ${actifs(s).length} inscrites !
${r>0?`Plus que ${r} place${r>1?'s':''} restante${r>1?'s':''}.`:'Complet ! Liste d\'attente ouverte.'}

Inscription en ligne : ${new URL('./',location.href).href}`;
  dlgPost.showModal();
}
bCopier.onclick=()=>{navigator.clipboard.writeText(txtPost.value);toast('Copié')};

function csv(){
  const s=S(),l=[['Nom','GSM','Statut','Paiement']].concat(s.inscrits.map(i=>[i.nom,i.tel,STATUTS[i.statut],i.paye?'Payé':'À payer']));
  const b=new Blob(['﻿'+l.map(r=>r.map(c=>'"'+String(c||'').replace(/"/g,'""')+'"').join(';')).join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`megajump-${s.cours}-${s.date}.csv`;a.click();
}

let edition=null;
function ouvrir(s){
  edition=s||null;const f=fSeance;
  dlgTitre.textContent=s?'Modifier la séance':'Nouvelle séance';
  f.cours.value=s?.cours||'Aérostep';f.date.value=s?.date||jour(1);f.heure.value=s?.heure||'18:00';
  f.lieu.value=s?.lieu||'École Saint François, Fontaine-l\'Évêque';f.places.value=s?.places||16;f.prix.value=s?.prix??8;
  dlgSeance.showModal();
}
dlgSeance.onclose=()=>{
  if(dlgSeance.returnValue!=='ok')return;const f=fSeance;
  const v={cours:f.cours.value,date:f.date.value,heure:f.heure.value,lieu:f.lieu.value,places:+f.places.value,prix:+f.prix.value||0};
  if(edition)Object.assign(edition,v);else{const s={id:uid(),...v,inscrits:[]};D.seances.push(s);D.sel=s.id}
  save();rendre();
};
bNew.onclick=()=>ouvrir();
bReset.onclick=()=>{if(confirm('Remettre les données de démonstration ?')){D=demo();save();rendre()}};
rendre();
</script>
</body>
</html>
