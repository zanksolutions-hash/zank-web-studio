<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soins infirmiers Kendall – Tournée et demandes</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#102954;--blue:#2f5f9e;--sky:#5e86b2;--pale:#eaf1fa;--pale2:#f5f8fd;--teal:#3a9fa3;--txt:#1d2b3f;--mut:#5d6b7e;--line:#dbe4f0;--ok:#2e8b57;--warn:#c27a00}
*{box-sizing:border-box}
body{margin:0;background:var(--pale2);color:var(--txt);font:15px/1.45 Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{font-family:Rubik,sans-serif;color:var(--navy);margin:0;line-height:1.15}
header{background:#fff;border-bottom:1px solid var(--line)}
header .w{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:Rubik,sans-serif;font-weight:700;color:var(--navy);font-size:17px;line-height:1.15}
.logo img{height:42px}
.logo small{display:block;font-weight:500;font-size:12px;color:var(--sky)}
.hb{display:flex;gap:8px;flex-wrap:wrap}
.w{max-width:1200px;margin:0 auto}
main.w{padding:20px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap;color:var(--navy)}
.btn:hover{border-color:var(--sky)}
.btn.p{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.p:hover{background:var(--blue)}
.btn.s{padding:5px 10px;font-size:13px}
.btn.ok{background:var(--teal);border-color:var(--teal);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat b{font-family:Rubik,sans-serif;font-size:30px;color:var(--navy);display:block}
.stat small{color:var(--mut)}
.stat.hl b{color:var(--teal)}
.cols{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
.cols>*{min-width:0}
@media(max-width:980px){.cols{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.card>h2{font-size:18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.cnt{font-family:Inter;font-size:12px;background:var(--teal);color:#fff;border-radius:20px;padding:2px 9px}
.dm{border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:12px;padding:12px;margin-bottom:10px}
.dm b{display:block;color:var(--navy)}
.dm .m{color:var(--mut);font-size:13px}
.dm .n{font-size:13px;background:var(--pale2);border-radius:8px;padding:6px 9px;margin-top:6px}
.dm .a{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.vide{color:var(--mut);font-size:14px;padding:10px 0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nav h2{font-size:20px;margin:0 8px}
.nav h2::first-letter{text-transform:uppercase}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:#fff;padding:7px 13px;cursor:pointer;font-weight:600;font-size:14px;color:var(--navy)}
.seg button.on{background:var(--navy);color:#fff}
.moment{margin-bottom:18px}
.moment h3{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--sky);margin-bottom:8px;display:flex;justify-content:space-between}
.pa{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff}
.pa.fait{background:var(--pale2)}
.pa.fait .who{opacity:.55;text-decoration:line-through}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center}
.pa.fait .chk{background:var(--teal);border-color:var(--teal);color:#fff}
.who b{color:var(--navy)}
.who .m{color:var(--mut);font-size:13px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--pale);color:var(--blue);margin-left:6px}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:600px){.pa{grid-template-columns:34px 1fr}.pa .acts{grid-column:2;justify-content:flex-start}}
.sem{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
@media(max-width:820px){.sem{grid-template-columns:1fr}}
.sj{background:var(--pale2);border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer}
.sj:hover{border-color:var(--sky)}
.sj.auj{border:2px solid var(--teal)}
.sj h4{margin:0 0 6px;font-size:13px;color:var(--navy)}
.sj h4::first-letter{text-transform:uppercase}
.sj div{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}
.sj div b{color:var(--navy)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td .m{color:var(--mut);font-size:13px}
@media(max-width:700px){thead{display:none}table,tbody,tr,td{display:block}tr{border-bottom:1px solid var(--line);padding:10px 0}td{border:none;padding:2px 0}}
dialog{border:none;border-radius:18px;padding:22px;width:min(520px,94vw);box-shadow:0 30px 80px rgba(16,41,84,.3)}
dialog::backdrop{background:rgba(16,41,84,.45)}
dialog h2{font-size:22px;margin-bottom:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.g2{grid-template-columns:1fr}}
label{display:block;font-size:13px;font-weight:500;color:var(--mut);margin:8px 0 4px}
dialog input,dialog select,dialog textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
.priv{font-size:12px;color:var(--mut);text-align:center;margin-top:20px}
</style>
</head>
<body>
<header><div class="w">
  <div class="logo"><img src="logo.png" alt=""><span>Soins infirmiers Kendall<small>Tournée et demandes</small></span></div>
  <div class="hb"><a class="btn" href="./" target="_blank">Voir le site</a><button class="btn" id="bReset">Réinitialiser</button><button class="btn p" id="bNew">+ Patient</button></div>
</div></header>

<main class="w">
  <div class="stats" id="stats"></div>
  <div class="cols">
    <aside class="card"><h2>Nouvelles demandes <span class="cnt" id="nNew"></span></h2><div id="demandes"></div></aside>
    <section class="card">
      <div class="bar">
        <div class="nav"><button class="btn s" id="bPrev" aria-label="Précédent">&larr;</button><button class="btn s" id="bAuj">Aujourd'hui</button><button class="btn s" id="bNext" aria-label="Suivant">&rarr;</button><h2 id="titre"></h2></div>
        <div class="seg"><button data-v="jour">Tournée</button><button data-v="sem">Semaine</button><button data-v="pat">Patients</button></div>
      </div>
      <div id="vue"></div>
    </section>
  </div>
  <p class="priv">Maquette : patients fictifs, données enregistrées dans ce navigateur uniquement.</p>
</main>

<dialog id="dlg"><form id="fP" method="dialog">
  <h2 id="dTitre">Patient</h2>
  <div class="g2">
    <div><label>Nom et prénom</label><input name="nom" required></div>
    <div><label>Téléphone</label><input name="tel" inputmode="tel" required></div>
    <div><label>Adresse</label><input name="adresse" required></div>
    <div><label>Commune</label><input name="commune" required></div>
    <div><label>Soin</label><select name="soin" id="sSoin"></select></div>
    <div><label>Moment</label><select name="moment" id="sMom"></select></div>
    <div><label>Fréquence</label><select name="freq" id="sFreq"></select></div>
    <div><label>Nombre de jours</label><input name="nbJours" type="number" min="1"></div>
    <div><label>Début</label><input name="debut" type="date" required></div>
    <div><label>Fin des soins (facultatif)</label><input name="fin" type="date"></div>
    <div style="grid-column:1/-1"><label>Infos d'accès</label><textarea name="note" rows="2"></textarea></div>
  </div>
  <div class="row"><button class="btn" value="x" formnovalidate>Fermer</button><button class="btn p" value="ok">Enregistrer</button></div>
</form></dialog>
<div class="toast" id="toast"></div>

<script src="commun.js"></script>
<script>
let D=charger(),cur=jour(0),vueM='jour',edit=null;
const save=()=>enregistrer(D);
const toastT=t=>{toast.textContent=t;toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),1800)};
const lundi=d=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()-((x.getDay()+6)%7));return iso(x)};
const maps=d=>'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(d.adresse+', '+d.commune+', Belgique');
const duJour=date=>D.demandes.filter(d=>passe(d,date));
const freqTxt=d=>d.freq==='jours'?(d.nbJours||7)+' jours':FREQ[d.freq].toLowerCase();
const smsTxt=d=>`Bonjour, ici Soins infirmiers Kendall. Votre demande est bien prise en compte : premier passage le ${fmtDate(d.debut)}, ${MOMENTS[d.moment].toLowerCase()}. À bientôt.`;

function rendre(){
  const auj=jour(0),nw=D.demandes.filter(d=>d.statut==='new').sort((a,b)=>a.cree-b.cree);
  const aj=duJour(auj),faits=aj.filter(d=>D.faits[d.id+'|'+auj]).length;
  const suivis=D.demandes.filter(d=>d.statut==='ok'&&(!d.fin||d.fin>=auj)&&(d.freq!=='une'||d.debut>=auj)&&(d.freq!=='jours'||plus(d.debut,d.nbJours||7)>auj));
  stats.innerHTML=`<div class="stat hl"><b>${nw.length}</b><small>nouvelles demandes</small></div>
    <div class="stat"><b>${aj.length}</b><small>passages aujourd'hui</small></div>
    <div class="stat"><b>${aj.length-faits}</b><small>restent à faire</small></div>
    <div class="stat"><b>${suivis.length}</b><small>patients suivis</small></div>`;
  nNew.textContent=nw.length;
  demandes.innerHTML=nw.length?nw.map(d=>`<div class="dm"><b>${esc(d.nom)}</b>
    <div class="m">${soin(d.soin).nom} · ${freqTxt(d)}</div>
    <div class="m">Dès le ${fmtCourt(d.debut)}, ${MOMENTS[d.moment].toLowerCase()}</div>
    <div class="m">${esc(d.adresse)}, ${esc(d.commune)}</div>
    <div class="m">Prescription : ${{oui:'oui',non:'non',nsp:'ne sait pas'}[d.prescription]}</div>
    ${d.note?`<div class="n">${esc(d.note)}</div>`:''}
    <div class="a"><button class="btn s ok" data-a="ok" data-i="${d.id}">Accepter</button><a class="btn s" href="tel:${telNorm(d.tel)}">Appeler</a><button class="btn s" data-a="edit" data-i="${d.id}">Modifier</button><button class="btn s" data-a="non" data-i="${d.id}">Refuser</button></div></div>`).join('')
    :'<div class="vide">Aucune nouvelle demande.</div>';

  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===vueM));
  [bPrev,bAuj,bNext].forEach(b=>b.style.display=vueM==='pat'?'none':'');
  if(vueM==='jour'){
    titre.textContent=cur===auj?'Tournée du jour':fmtDate(cur);
    const l=duJour(cur);
    vue.innerHTML=l.length?Object.entries(MOMENTS).map(([k,v])=>{const m=l.filter(d=>d.moment===k).sort((a,b)=>a.commune.localeCompare(b.commune));if(!m.length)return'';
      return `<div class="moment"><h3><span>${v}</span><span>${m.filter(d=>D.faits[d.id+'|'+cur]).length}/${m.length}</span></h3>${m.map(d=>{const f=D.faits[d.id+'|'+cur];
        return `<div class="pa ${f?'fait':''}"><button class="chk" data-a="fait" data-i="${d.id}" aria-label="Marquer fait">${f?'&#10003;':''}</button>
        <div class="who"><b>${esc(d.nom)}</b><span class="tag">${soin(d.soin).nom}</span><div class="m">${esc(d.adresse)}, ${esc(d.commune)}</div>${d.note?`<div class="m">${esc(d.note)}</div>`:''}</div>
        <div class="acts"><a class="btn s" target="_blank" rel="noopener" href="${maps(d)}">Itinéraire</a><a class="btn s" href="tel:${telNorm(d.tel)}">Appeler</a></div></div>`}).join('')}</div>`}).join('')
      :'<div class="vide">Aucun passage prévu ce jour-là.</div>';
  }else if(vueM==='sem'){
    const lu=lundi(cur);titre.textContent='Semaine du '+fmtCourt(lu);
    vue.innerHTML='<div class="sem">'+[0,1,2,3,4,5,6].map(i=>{const d=plus(lu,i),l=duJour(d);
      return `<div class="sj ${d===auj?'auj':''}" data-a="jour" data-d="${d}"><h4>${fmtCourt(d)}</h4>${Object.entries(MOMENTS).map(([k,v])=>`<div><span>${v}</span><b>${l.filter(x=>x.moment===k).length}</b></div>`).join('')}<div style="margin-top:4px;border-top:1px solid var(--line);padding-top:4px"><span>Total</span><b>${l.length}</b></div></div>`}).join('')+'</div>';
  }else{
    titre.textContent='Patients';
    const l=D.demandes.filter(d=>d.statut==='ok').sort((a,b)=>a.nom.localeCompare(b.nom));
    vue.innerHTML=l.length?`<table><thead><tr><th>Patient</th><th>Soin</th><th>Rythme</th><th>Depuis</th><th></th></tr></thead><tbody>${l.map(d=>{const fini=suivis.indexOf(d)<0;
      return `<tr style="${fini?'opacity:.55':''}"><td><b>${esc(d.nom)}</b><div class="m">${esc(d.adresse)}, ${esc(d.commune)} · <a href="tel:${telNorm(d.tel)}">${esc(d.tel)}</a></div></td>
      <td>${soin(d.soin).nom}</td><td>${freqTxt(d)}, ${MOMENTS[d.moment].toLowerCase()}</td><td>${fmtCourt(d.debut)}${fini?'<div class="m">terminé</div>':''}</td>
      <td style="text-align:right;white-space:nowrap"><button class="btn s" data-a="edit" data-i="${d.id}">Modifier</button>${fini?'':` <button class="btn s" data-a="stop" data-i="${d.id}">Arrêter</button>`}</td></tr>`}).join('')}</tbody></table>`
      :'<div class="vide">Aucun patient.</div>';
  }
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>action(b.dataset.a,b.dataset.i,b.dataset.d));
}

function action(a,id,date){
  if(a==='jour'){cur=date;vueM='jour';return rendre()}
  const d=D.demandes.find(x=>x.id===id);
  if(a==='edit')return ouvrir(d);
  if(a==='fait'){const k=d.id+'|'+cur;if(D.faits[k])delete D.faits[k];else D.faits[k]=true}
  if(a==='ok'){d.statut='ok';toastT('Patient ajouté à la tournée');if(confirm('Envoyer un SMS de confirmation à '+d.nom+' ?'))location.href=`sms:${telNorm(d.tel).replace(/^0/,'+32')}?body=${encodeURIComponent(smsTxt(d))}`}
  if(a==='non'){if(!confirm('Refuser la demande de '+d.nom+' ?'))return;d.statut='non'}
  if(a==='stop'){if(!confirm('Arrêter les soins de '+d.nom+' à partir de demain ?'))return;d.fin=jour(0);toastT('Soins arrêtés')}
  save();rendre();
}

sSoin.innerHTML=SOINS.map(s=>`<option value="${s.id}">${s.nom}</option>`).join('');
sMom.innerHTML=Object.entries(MOMENTS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
sFreq.innerHTML=Object.entries(FREQ).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
function ouvrir(d){
  edit=d||null;dTitre.textContent=d?'Modifier':'Nouveau patient';
  const v=d||{nom:'',tel:'',adresse:'',commune:'Anderlues',soin:'hyg',moment:'mat',freq:'quot',nbJours:'',debut:cur,fin:'',note:''};
  for(const k of['nom','tel','adresse','commune','soin','moment','freq','nbJours','debut','fin','note'])fP.elements[k].value=v[k]??'';
  dlg.showModal();
}
dlg.onclose=()=>{
  if(dlg.returnValue!=='ok')return;const f=fP.elements;
  const v={};for(const k of['nom','tel','adresse','commune','soin','moment','freq','debut','fin','note'])v[k]=f[k].value.trim();
  v.nbJours=+f.nbJours.value||null;v.fin=v.fin||null;
  if(edit)Object.assign(edit,v);else D.demandes.push({id:uid(),prescription:'oui',statut:'ok',cree:Date.now(),...v});
  save();rendre();toastT('Enregistré');
};
bNew.onclick=()=>ouvrir();
bPrev.onclick=()=>{cur=plus(cur,vueM==='jour'?-1:-7);rendre()};
bNext.onclick=()=>{cur=plus(cur,vueM==='jour'?1:7);rendre()};
bAuj.onclick=()=>{cur=jour(0);rendre()};
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{vueM=b.dataset.v;rendre()});
bReset.onclick=()=>{if(confirm('Remettre les données de démonstration ?')){D=demo();save();rendre()}};
addEventListener('storage',e=>{if(e.key===CLE){D=charger();rendre();toastT('Nouvelle demande reçue')}});
rendre();
</script>
</body>
</html>
